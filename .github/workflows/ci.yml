# GitHub Actions Workflow · ai-landing-specialist
# Fleet template: 純靜態 HTML/CSS/JS → GitHub Pages
# 4 個靜態檔案 (index.html redirect + dashboard.html + styles.css + script.js),無需 npm build

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ai-landing-specialist 是純靜態 HTML/CSS/JS（4 個檔案），無需 npm build
  # index.html → meta refresh → ./dashboard.html
  # Vercel 既有產線保留（雙軌並行，見 PRD §A.7）

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HTML structure check
        run: |
          echo "--- 4 個靜態檔案檢查 ---"
          for f in index.html dashboard.html styles.css script.js; do
            if [ -f "$f" ]; then
              echo "✅ $f ($(wc -c < "$f") bytes)"
            else
              echo "❌ MISSING: $f"
              exit 1
            fi
          done
      - name: HTML validity quick check
        run: |
          echo "--- HTML 結構快查 ---"
          for f in *.html; do
            head -c 200 "$f" | grep -q '<html' || { echo "❌ $f: no <html> tag"; exit 1; }
            grep -q '</html>' "$f" || { echo "❌ $f: no </html> closing tag"; exit 1; }
            echo "✅ $f: well-formed"
          done
      - name: CSS sanity check
        run: |
          echo "--- CSS 結構快查 ---"
          if [ -f styles.css ]; then
            head -c 500 styles.css | grep -q ':root' || echo "⚠️  no :root design tokens (v4 設計系統預期有 :root { --bg / --accent })"
            grep -q 'Inter' styles.css && echo "✅ Inter font reference" || echo "⚠️  no Inter font reference"
          fi

  test:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links
        run: |
          echo "--- 內部連結檢查 ---"
          broken=0
          for f in *.html; do
            for link in $(grep -oE 'href="[^"]*\.html"' "$f" 2>/dev/null | tr -d '"' | sed 's/href=//'); do
              if [ ! -f "$link" ]; then
                echo "❌ $f → $link (NOT FOUND)"
                broken=$((broken + 1))
              else
                echo "✅ $f → $link"
              fi
            done
            for link in $(grep -oE 'href="[^"]*\.css"' "$f" 2>/dev/null | tr -d '"' | sed 's/href=//'); do
              # 只檢查相對連結（不以 http 開頭）
              if [[ "$link" != http* ]] && [ ! -f "$link" ]; then
                echo "❌ $f → $link (NOT FOUND)"
                broken=$((broken + 1))
              else
                echo "✅ $f → $link"
              fi
            done
            for link in $(grep -oE 'src="[^"]*\.js"' "$f" 2>/dev/null | tr -d '"' | sed 's/src=//'); do
              if [[ "$link" != http* ]] && [ ! -f "$link" ]; then
                echo "❌ $f → $link (NOT FOUND)"
                broken=$((broken + 1))
              else
                echo "✅ $f → $link"
              fi
            done
          done
          if [ $broken -gt 0 ]; then
            echo "Found $broken broken links"
            exit 1
          fi
          echo "✅ All internal links valid"

  build:
    name: Build (no-op for static)
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Static site build (no-op)
        run: |
          echo "Static HTML/CSS/JS site — no build step required"
          echo "Source files:"
          ls -la *.html *.css *.js 2>/dev/null
          echo "Total size:"
          du -sh .

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [build]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # 上傳整個 repo 根目錄（4 個靜態檔案 + PRD/）

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
